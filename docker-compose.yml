
services:
  #http://corpgateway.localtest.me/web/home?0
  #primaryHostID: corporate 
  corpGateway:
    image: inductiveautomation/ignition:${IGN_VERSION:-8.1.49}
    container_name: ${CORP_IGN_GATEWAY_NAME}
    hostname: ${CORP_IGN_GATEWAY_NAME}
    user: 0:0
    volumes:
      # Gateway backup
      - ./gw-init/corpGateway.gwbk:/restore.gwbk
      # Ignition data
      - ignDataCorp:/usr/local/bin/ignition/data
      #Ignition module seeds
      - ./module-init/MQTT-Engine-signed.modl:/usr/local/bin/ignition/user-lib/modules/MQTT-Engine.modl
    labels:
      - traefik.enable=true
      - traefik.hostname=${CORP_IGN_GATEWAY_NAME}
    environment:
      ACCEPT_IGNITION_EULA: 'Y'
      GATEWAY_ADMIN_USERNAME: ${CORP_IGN_USERNAME}
      GATEWAY_ADMIN_PASSWORD: ${CORP_IGN_PASSWORD}
      IGNITION_EDITION: ${CORP_IGN_EDITION}
      TZ: ${IGN_TZ:-America/New_York}
      DISABLE_QUICKSTART: 'true'
    # ports:
    #   - ${CORP_IGN_GATEWAY_PORT}:8088
    command: >
      -n ${CORP_IGN_GATEWAY_NAME}
      -h 80
      -s 443
      -a ${CORP_IGN_GATEWAY_NAME}
      -r /restore.gwbk      
    networks:
      - default
    profiles: ["corpGateway"]
      
  siteGateway:
