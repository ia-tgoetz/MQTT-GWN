      POSTGRES_USER: ${SITE_POSTG_USER:-ignition}
      POSTGRES_PASSWORD: ${SITE_POSTG_PASSWORD:-ignition}
      TZ: ${IGN_TZ:-America/New_York}
    networks:
      - default
    profiles: ["sitePostgres"]
#---------------------------------------------------------------------------------
  chariot:
    build:
      context: . # The build context is the current directory
      dockerfile: dockerfile # Specifies the name of the dockerfile
    container_name: chariot-server
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT Port
      - "8080:8080" # Web UI Port
    volumes:
      # This maps a local folder to the container's data directory
      # for persistent configuration and data.
      - ./chariot-data:/usr/local/chariot/data
    networks:
      - default
    profiles: ["chariot"]
#---------------------------------------------------------------------------------
#EQMX Initial username and Password
      #Username: admin 
      #Password: public ► Ignition1!
      #Dashboard: http://localhost:18083/#/dashboard/overview

  emqx:
    image: emqx/emqx:latest
    hostname: emqx
    container_name: emqx
    ports:
#      - "1883:1883"        # MQTT
#      - "8883:8883"        # MQTT/TLS
      - "8083:8083"        # HTTP Management
      - "18083:18083"      # Dashboard
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
      - EMQX_NODE__DIST_LISTEN_MAX=6379
    volumes:
      - emqx:/opt/emqx/data
      - emqxlog:/opt/emqx/log
    networks:
      - default
    profiles: ["emqx"]


networks:
  default:
    external: true
    name: proxy
    driver: bridge

volumes:
    ignDataCorp:
    ignDataSite:
    ignDataEdge:
    ignDataEdge1:
    ignDataEdge2:
    postgDataCorp:
    postgDataSite:
    emqx:
    emqxlog:
