#---------------------------------------------------------------------------------
  
  # http://chariot.localtest.me  -  https://chariot.localtest.me
  # admin / ${CHARIOT_ADMIN_PASSWORD}
  chariot:
    image: cirruslink/chariot:${CHARIOT_VERSION:-latest}
    container_name: ${CHARIOT_NAME:-chariot}
    hostname: ${CHARIOT_NAME:-chariot}
    volumes:
      # H2 database - all broker config, MQTT users, ACLs
      - chariotH2:/Chariot/h2
      # License files
      - chariotLicense:/Chariot/license
      # First-run config sentinel; set an "applied" to false to re-run that step
      - chariotState:/Chariot/config-state
      # Named volumes (NOT binds) - these dirs ship files in the image that a
      # bind mount would shadow
      - chariotConf:/Chariot/conf
      - chariotSecurity:/Chariot/security
    labels:
      - traefik.enable=true
      - traefik.hostname=${CHARIOT_NAME:-chariot}
      # Required: the image exposes 6 ports, so traefik cannot auto-select one
      - traefik.http.services.chariot.loadbalancer.server.port=8080
    environment:
      ACCEPT_EULA: "true"
      ADMIN_PASSWORD: ${CHARIOT_ADMIN_PASSWORD:-mypassword}
      CHARIOT_SERVER_NAME: ${CHARIOT_NAME:-chariot}
      TZ: ${IGN_TZ:-America/New_York}
      LICENSE_TYPE: ${CHARIOT_LICENSE_TYPE:-}
      LICENSE_KEY: ${CHARIOT_LICENSE_KEY:-}
      
    ports:
      # MQTT - published so off-stack clients can connect. In-stack gateways
      # should use tcp://chariot:1883 over the proxy network instead.
      - "${CHARIOT_MQTT_PORT:-1883}:1883"
      # Web UI is fronted by traefik; uncomment for direct access if proxy is down
      # - "8081:8080"
      # Chariot's own HTTPS - unused, traefik terminates TLS on :443
      # - "8443:8443"
      # - "8883:8883"   # MQTT/TLS      - needs SETUP_SSL + SERVER_CONFIG
      # - "8090:8090"   # MQTT over WS  - needs SERVER_CONFIG webSocketEnable
      # - "8091:8091"   # MQTT over WSS
    restart: unless-stopped
    networks:
      - default
    profiles: ["chariot"]
#---------------------------------------------------------------------------------
#EQMX Initial username and Password
      #Username: admin 
      #Password: public ► Ignition1!
      #Dashboard: http://localhost:18083/#/dashboard/overview

  emqx:
    image: emqx/emqx:latest
    hostname: emqx
    container_name: emqx
    ports:
#      - "1883:1883"        # MQTT
#      - "8883:8883"        # MQTT/TLS
      - "8083:8083"        # HTTP Management
      - "18083:18083"      # Dashboard
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
      - EMQX_NODE__DIST_LISTEN_MAX=6379
    volumes:
      - emqx:/opt/emqx/data
      - emqxlog:/opt/emqx/log
    networks:
      - default
    profiles: ["emqx"]


networks:
  default:
    external: true
    name: proxy
    driver: bridge

volumes:
    ignDataCorp:
    resourcesCorp:
      driver: local
      driver_opts:
        type: none
        device: services/corpGateway/config/resources
